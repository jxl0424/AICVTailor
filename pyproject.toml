[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicvtailor"
version = "0.1.0"
description = "Local-first resume tailoring against job descriptions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
aicvtailor = "aicvtailor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/aicvtailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
