# ---------------------------------------------------------------------------
# Truth guardrails. Enforced in CODE after the model returns, not just in the
# prompt. A violation fails the generation and retries once with the violation
# quoted back to the model; a second violation is a hard failure.
# ---------------------------------------------------------------------------

# Claims that must NEVER appear in tailored output, even if they appear in the
# master resume or your notes. Matched case-insensitively with whitespace and
# punctuation normalised. Entries starting with "re:" are treated as regexes.
forbidden_claims: []
  # Put real entries in config/guardrails.local.yaml instead -- that file is
  # gitignored, and these strings are usually the ones you cannot publish.
  # - "Project Halberd"          # NDA'd, cannot be named
  # - "re:\\b(security clearance|SC cleared)\\b"

# Exact strings that must be copied verbatim wherever they appear.
#
# You do NOT need to list job titles, employers, degree names, institutions or
# dates here. Those live in entry headers, and the parser gives headers no
# editable span at all -- there is no id that addresses them, so no code path
# can rewrite one. See tests/test_latex_immutability.py.
#
# This list is for strings that appear inside BULLETS and must survive a
# rewrite untouched: certification names, product names, exact framings you
# have already had checked by someone.
never_reword: []
  # - "Chartered Engineer"
  # - "ISO 27001"

# Hard cap on a rewritten bullet, in characters. Rewrites over this are
# rejected and retried. Keeps one-page layouts from silently overflowing.
max_bullet_length: 240

# Maximum pages for the compiled PDF. Set to null to allow any length.
max_pages: 1

# Reject a rewrite that introduces a number, date, percentage or proper noun
# not present in its source bullet. This is the main anti-fabrication check.
forbid_new_entities: true

# Numbers exempt from the check above (version numbers, common ordinals).
entity_allowlist:
  - "3"
  - "5"
