# ---------------------------------------------------------------------------
# Skills dictionary. Maps surface forms found in job descriptions onto a
# canonical term so "PyTorch", "torch" and "Py Torch" collapse to one entry.
# This file is meant to grow -- every JD you run through the system is a
# chance to add a synonym it missed.
#
# category: hard_skill | tool | method | domain | soft_skill
# ---------------------------------------------------------------------------

terms:
  - canonical: Python
    category: hard_skill
    synonyms: [python3, "python 3", cpython]

  - canonical: TypeScript
    category: hard_skill
    synonyms: [ts, "type script"]

  - canonical: PyTorch
    category: tool
    synonyms: [torch, "py torch", pytorch-lightning, "pytorch lightning"]

  - canonical: FastAPI
    category: tool
    synonyms: ["fast api"]

